<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_4 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_4" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_4');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // NOIR Studio Interactive 3D Sculpture System
// Container is provided in scope by Stitch
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.set(0, 0, 8);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

// Master Group holding the iconic sculpture
const masterGroup = new THREE.Group();
scene.add(masterGroup);

// Create an architectural, organic, mathematical sculpture:
// Combining Parametric Torus Geometry + Inner Wireframe Cage + Monolithic Ring Core
const mainGeo = new THREE.TorusKnotGeometry(1.8, 0.42, 220, 36, 2, 5);

// Outer Architectural Matte Dark Stone / Brushed Carbon Mesh
const mainMat = new THREE.MeshPhysicalMaterial({
  color: 0x161618,
  emissive: 0x050507,
  roughness: 0.35,
  metalness: 0.85,
  clearcoat: 0.6,
  clearcoatRoughness: 0.2,
  reflectivity: 0.9,
  wireframe: false,
});
const sculpture = new THREE.Mesh(mainGeo, mainMat);
masterGroup.add(sculpture);

// Subtle wireframe exoskeleton accentuating structural precision
const wireGeo = new THREE.TorusKnotGeometry(1.81, 0.425, 120, 16, 2, 5);
const wireMat = new THREE.MeshBasicMaterial({
  color: 0x484852,
  wireframe: true,
  transparent: true,
  opacity: 0.18
});
const wireMesh = new THREE.Mesh(wireGeo, wireMat);
masterGroup.add(wireMesh);

// Center Gyroscopic Monolith Rings (Architectural Orbit)
const ringGeo1 = new THREE.TorusGeometry(3.0, 0.015, 16, 100);
const ringMat = new THREE.MeshBasicMaterial({ color: 0xa3a3b0, transparent: true, opacity: 0.35 });
const ring1 = new THREE.Mesh(ringGeo1, ringMat);
ring1.rotation.x = Math.PI / 3;
masterGroup.add(ring1);

const ringGeo2 = new THREE.TorusGeometry(3.4, 0.01, 16, 100);
const ringMat2 = new THREE.MeshBasicMaterial({ color: 0x6e6e7d, transparent: true, opacity: 0.2 });
const ring2 = new THREE.Mesh(ringGeo2, ringMat2);
ring2.rotation.y = Math.PI / 4;
masterGroup.add(ring2);

// Subtle Floating Precision Coordinate Dots (Constellation Nodes)
const dotCount = 45;
const dotGeo = new THREE.BufferGeometry();
const positions = new Float32Array(dotCount * 3);
for (let i = 0; i < dotCount * 3; i += 3) {
  positions[i] = (Math.random() - 0.5) * 8;
  positions[i+1] = (Math.random() - 0.5) * 8;
  positions[i+2] = (Math.random() - 0.5) * 6;
}
dotGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const dotMat = new THREE.PointsMaterial({ color: 0xd4d4dc, size: 0.035, transparent: true, opacity: 0.4 });
const pointCloud = new THREE.Points(dotGeo, dotMat);
masterGroup.add(pointCloud);

// Cinematic Studio Lighting
const ambientLight = new THREE.AmbientLight(0x0e0e12, 1.8);
scene.add(ambientLight);

// Key Light: Dramatic cold white
const keyLight = new THREE.DirectionalLight(0xf0f2f8, 3.2);
keyLight.position.set(5, 8, 7);
scene.add(keyLight);

// Rim Light: Architectural Cyan / Pale Slate Edge
const rimLight = new THREE.DirectionalLight(0x6ee7b7, 1.4); // subtle jade/emerald restrained accent
rimLight.position.set(-6, -4, -5);
scene.add(rimLight);

// Bottom Fill Light
const fillLight = new THREE.PointLight(0x38384a, 2.0, 20);
fillLight.position.set(0, -5, 4);
scene.add(fillLight);

// Interactive Tracking & Scroll Progression
let targetMouseX = 0;
let targetMouseY = 0;
let mouseX = 0;
let mouseY = 0;
let scrollProgress = 0;

window.addEventListener('mousemove', (e) => {
  targetMouseX = (e.clientX / window.innerWidth - 0.5) * 2;
  targetMouseY = (e.clientY / window.innerHeight - 0.5) * 2;
});

window.addEventListener('scroll', () => {
  const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
  if (maxScroll > 0) {
    scrollProgress = window.scrollY / maxScroll;
  }
});

// Window Resize Handling
const handleResize = () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
};
window.addEventListener('resize', handleResize);

// Animation Loop with continuous multi-stage scroll choreography
let clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsedTime = clock.getElapsedTime();

  // Smooth lerp mouse tracking
  mouseX += (targetMouseX - mouseX) * 0.05;
  mouseY += (targetMouseY - mouseY) * 0.05;

  // Base slow organic rotation
  sculpture.rotation.x = elapsedTime * 0.18 + mouseY * 0.4;
  sculpture.rotation.y = elapsedTime * 0.24 + mouseX * 0.5;
  wireMesh.rotation.x = sculpture.rotation.x;
  wireMesh.rotation.y = sculpture.rotation.y;

  ring1.rotation.z = elapsedTime * 0.12;
  ring2.rotation.x = elapsedTime * -0.09;

  // Continuous Section Choreography based on scroll progress:
  // 0.0 (Hero): Center-Right, poised, scale 1.05
  // 0.2 (Manifesto): Approaches camera, scale 1.5, shifts slightly left
  // 0.45 (Work): Deforms orientation, moves to side, reveals case studies
  // 0.7 (Services): Expands rings, centers, reacts to mouse
  // 0.88 (About): Recedes deeper, scale drops to 0.7
  // 1.0 (Contact): Distant monolith totem, z = -4, scale 0.5
  
  const targetX = 1.2 * (1 - scrollProgress * 2.2) + mouseX * 0.6;
  const targetY = -scrollProgress * 1.5 - mouseY * 0.5;
  const targetZ = scrollProgress < 0.25 
    ? (scrollProgress / 0.25) * 2.0 
    : 2.0 - (scrollProgress - 0.25) * 7.5;
    
  const targetScale = scrollProgress < 0.2 
    ? 1.05 + scrollProgress * 2.0 
    : Math.max(0.45, 1.45 - (scrollProgress - 0.2) * 1.6);

  masterGroup.position.x += (targetX - masterGroup.position.x) * 0.06;
  masterGroup.position.y += (targetY - masterGroup.position.y) * 0.06;
  masterGroup.position.z += (targetZ - masterGroup.position.z) * 0.06;

  const currentScale = masterGroup.scale.x;
  const newScale = currentScale + (targetScale - currentScale) * 0.06;
  masterGroup.scale.set(newScale, newScale, newScale);

  renderer.render(scene, camera);
}

animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_4 -->
</body>
</html>
